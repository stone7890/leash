# Leash — the single front door.
#
# Everything a browser or an agent talks to arrives here, so there is one origin, one certificate,
# and one place to read the routing. The map below is docs/01-architecture.md's endpoint table,
# expressed in configuration.
#
# The rule that matters: the SIGNER is reachable only at /v1/sign, and only by agents. There is no
# location block that exposes anything else of it, and the dashboard has no reason to reach it.
# "The browser cannot reach the signer" is not expressible in a linter, so it is enforced here and
# asserted by the post-deploy smoke test.

# Upstreams are resolved AT REQUEST TIME, not at start-up.
#
# nginx resolves a name in `upstream` exactly once, when it loads its configuration. Recreating any
# service gives it a new address, and nginx keeps sending traffic to the old one — every request
# 502s until nginx itself is restarted. That turns a routine redeploy of one service into an
# outage of the whole front door.
#
# Docker's embedded DNS lives at 127.0.0.11. Putting the target in a VARIABLE is what forces nginx
# to look it up per request rather than baking it in.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;

# The agent path is machine-to-machine and has a 300ms budget. It gets its own rate limit, keyed by
# the API key rather than the address, because many agents share an egress address.
limit_req_zone $http_x_leash_key zone=signing:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=dashboard:10m rate=30r/s;

server {
    listen 80;
    # IPv6 as well. Without it, a health check that resolves `localhost` gets ::1 first and is
    # refused — the container looks unhealthy while serving every real request perfectly.
    listen [::]:80;
    server_name _;

    client_max_body_size 1m;
    proxy_http_version 1.1;

    # A trace identifier joins the nginx log, the application log and the handshake record. If the
    # caller supplied one, keep it — an agent SDK correlating its own retries is doing the right
    # thing.
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── The signing path ─────────────────────────────────────────────────────
    #
    # The only route to the signer, and the only one authenticated by an agent key. Its timeouts
    # are short on purpose: the budget is 300ms at p99, and a signing request that has been open
    # for ten seconds is not going to succeed — it is going to be retried, and the retry must find
    # the claim rather than a second attempt in flight.
    location = /v1/sign {
        limit_req zone=signing burst=20 nodelay;
        set $signer_upstream signer:4100;
        proxy_pass http://$signer_upstream;
        proxy_connect_timeout 2s;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;
        proxy_next_upstream   off;   # never replay a signing request against a second instance
    }

    # ── The onboarding stream ────────────────────────────────────────────────
    #
    # Server-sent events over a resumable change stream, held for the length of a wizard session.
    # Buffering must be off or the log arrives in one lump at the end, which defeats the entire
    # point of showing a payment happening.
    location ~ ^/v1/test-payments/[^/]+/stream$ {
        set $indexer_upstream indexer:4300;
        proxy_pass http://$indexer_upstream;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
        proxy_set_header Connection '';
    }

    # ── The sample x402 endpoint ─────────────────────────────────────────────
    #
    # Sandbox only. It is served through the same front door so that onboarding step 5 calls a real
    # URL over the network rather than something reachable only from inside the compose network.
    location /demo/ {
        set $demo_upstream demo402:4200;
        # No URI after the host: with a variable in proxy_pass, nginx passes the request URI
        # through unchanged rather than doing the prefix substitution it would do with a literal.
        proxy_pass http://$demo_upstream;
        proxy_read_timeout 30s;
    }

    # ── Health ───────────────────────────────────────────────────────────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── The API routes the dashboard serves ──────────────────────────────────
    #
    # The contract puts every endpoint under /v1. Next.js serves route handlers from app/api, so
    # the two are joined here rather than by giving the API a different public path than the one
    # docs/05-api-contract.md specifies.
    #
    # This block is a PREFIX match, so the exact /v1/sign and the regex for the stream above both
    # win over it — nginx tries exact, then regex, then longest prefix.
    location /v1/ {
        limit_req zone=dashboard burst=60 nodelay;
        set $web_upstream website:3000;
        # The rewrite is EXPLICIT, for the same reason: a variable in proxy_pass turns off the
        # automatic prefix substitution, so /v1/x must be mapped to /api/v1/x here or it arrives
        # at Next.js unchanged and 404s.
        rewrite ^/v1/(.*)$ /api/v1/$1 break;
        proxy_pass http://$web_upstream;
        proxy_read_timeout 60s;
    }

    # ── The dashboard ────────────────────────────────────────────────────────
    location / {
        limit_req zone=dashboard burst=60 nodelay;
        set $web_root website:3000;
        proxy_pass http://$web_root;
        proxy_read_timeout 60s;
    }
}
